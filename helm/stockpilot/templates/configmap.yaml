apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stockpilot.fullname" . }}-backend
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  APP_VERSION: {{ default .Chart.AppVersion .Values.backend.image.tag | quote }}
  SEED_DEMO_DATA: {{ .Values.backend.seedDemoData | quote }}
  CORS_ORIGINS: {{ printf "[\"http://%s\", \"https://%s\"]" (default "localhost" .Values.ingress.host) (default "localhost" .Values.ingress.host) | quote }}
