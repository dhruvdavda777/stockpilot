{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $ns := .Release.Namespace }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "stockpilot.fullname" . }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: stockpilot.rules
      rules:
        - alert: StockPilotBackendDown
          expr: absent(up{namespace="{{ $ns }}", service="{{ include "stockpilot.fullname" . }}-backend"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: No StockPilot backend target is up
            description: Prometheus cannot scrape any backend pod in {{ $ns }} for 2 minutes.
        - alert: StockPilotHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ $ns }}", status="5xx"}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="{{ $ns }}"}[5m])), 1e-9) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of StockPilot API requests are failing
        - alert: StockPilotSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ $ns }}"}[5m]))) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: StockPilot API p95 latency is above 500ms
        - alert: StockPilotHpaAtMax
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="{{ $ns }}"}
              >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="{{ $ns }}"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Backend HPA has been pinned at max replicas for 10 minutes
{{- end }}
