# SCENARIO 2 — Service with no endpoints
# Pods are healthy, but the Service selector doesn't match their labels.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: troubleshooting
spec:
  replicas: 2
  selector:
    matchLabels: {app: storefront}
  template:
    metadata:
      labels: {app: storefront, tier: web}
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: troubleshooting
spec:
  selector:
    app: store-front        # BUG: pods are labelled app=storefront
  ports:
    - port: 80
      targetPort: 8080
