# FIX 3 — probe the path and port the container actually serves.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: troubleshooting
spec:
  replicas: 2
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog}
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
