# SCENARIO 3 — Running but never Ready
# The readiness probe points at a path/port the container doesn't serve.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: troubleshooting
spec:
  replicas: 2
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog}
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready        # BUG: nginx serves / ; there is no /ready
              port: 80            # BUG: the unprivileged image listens on 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: troubleshooting
spec:
  selector: {app: catalog}
  ports:
    - port: 80
      targetPort: 8080
