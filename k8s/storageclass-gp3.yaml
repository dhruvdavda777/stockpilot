# EKS only. Recent EKS versions no longer mark any StorageClass as default, so the
# PostgreSQL PVC needs one. Requires the aws-ebs-csi-driver addon (terraform/eks.tf).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
